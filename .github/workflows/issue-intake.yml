name: Infrastructure Issue Intake

# DESACTIVADO para evitar consumo de minutos de Actions.
# Para reactivar, restaura el disparador:
#   issues:
#     types: [opened]
on:
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'infrastructure-request') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Explain next steps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body "$(cat <<'EOF'
          ## Infrastructure Copilot

          I received your request. This lab's platform currently supports two modules:
          - **ECR**: container image repository
          - **Secrets Manager**: secret container (the real value is loaded outside Terraform)

          Please make sure the request includes:
          - aplicación: application or team name in lowercase, for example pagos
          - module: ECR or Secrets Manager
          - repository_name (ECR) or secret_name (Secrets Manager), for example pagos/api or pagos/dev/db-password
          - environment: dev, test, staging, or prod
          - region: AWS region, for example us-east-1

          Reply in a comment with missing values using key: value lines. Do not post secrets or customer data.

          **Current mode:** the Copilot extracts the parameters, validates them against the module catalog and opens a Pull Request with Terraform. No AWS resources are created and no Terraform apply is configured.
          EOF
          )"
