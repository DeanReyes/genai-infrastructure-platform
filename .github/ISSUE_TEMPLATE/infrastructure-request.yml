name: Infrastructure request
description: Request infrastructure through the GenAI platform
title: "[infra] "
labels: ["infrastructure-request"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you need in plain language. The assistant will ask for missing required values.
        Do not include credentials, secrets, customer data, or other sensitive information.
  - type: textarea
    id: request
    attributes:
      label: Infrastructure request
      description: "Example: I need a container image repository for the payments API."
      placeholder: I need an ECR repository for ...
    validations:
      required: true
  - type: input
    id: application
    attributes:
      label: Application or team (optional)
      description: Lowercase letters, numbers and hyphens. Used to name the infrastructure repository (infra-<name>).
      placeholder: pagos
  - type: dropdown
    id: module
    attributes:
      label: Module (optional)
      description: Leave empty if you are not sure; the assistant will choose from the available modules.
      options:
        - ECR (container image repository)
        - Secrets Manager (secret container)
  - type: input
    id: environment
    attributes:
      label: Environment (optional)
      placeholder: dev
  - type: input
    id: region
    attributes:
      label: AWS region (optional)
      placeholder: us-east-1
  - type: input
    id: resource_name
    attributes:
      label: Resource name (optional)
      description: "Repository name for ECR (pagos/api) or secret name for Secrets Manager (pagos/dev/db-password). Never put the secret value here."
      placeholder: pagos/api
